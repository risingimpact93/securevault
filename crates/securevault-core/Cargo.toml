[package]
name = "securevault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared SecureVault vault crypto, file format, and MCP tool logic"
license = "MIT"

[features]
default = []
fast-kdf = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "http1"] }
sha2 = "=0.10.9"
hkdf = "0.12"
data-encoding = "2.11.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "=1.19.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.40", default-features = false, features = ["clock", "std", "serde"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
secrecy = "0.8"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.5.1", features = ["OSX_10_13"] }

[dev-dependencies]
tempfile = "3"
