# xcodegen spec for the small containing app that carries the Safari web extension.
# Generated by scripts/build-safari-extension.sh; ad-hoc signed, never notarized.
name: SecureVaultSafari
options:
  # Runner image ships Xcode 15.4; XcodeGen 2.46 defaults to format 77 (Xcode 16).
  projectFormat: xcode15_3
  bundleIdPrefix: com.securevault
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
targets:
  SecureVaultSafari:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
    dependencies:
      - target: SecureVaultSafariExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securevault.safari
        PRODUCT_NAME: "SecureVault Safari"
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_FILE: App/Info.plist
  SecureVaultSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes: [Resources, Info.plist, Extension.entitlements]
      # Safari reads manifest.json from the appex's Contents/Resources root, so the
      # top-level files go in as a group (copied flat) and only lib/ stays a folder.
      - path: Extension/Resources
        excludes: [lib]
        buildPhase: resources
      - path: Extension/Resources/lib
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securevault.safari.extension
        PRODUCT_NAME: SecureVaultSafariExtension
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        INFOPLIST_FILE: Extension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
