[workspace]
members = [
    "src-tauri",
    "crates/securevault-core",
    "crates/securevault-web",
    "crates/securevault-ios",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.77.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
